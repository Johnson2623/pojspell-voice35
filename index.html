<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ChatGPT 修改圖檔指令產生器</title>
<style>
:root{--bg:#f7f6f2;--card:#fff;--tx:#1f1f1c;--mu:#6b6a63;--bd:#e2e0d8;--ac:#10a37f;--acx:#fff;--chip:#efede6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171716;--card:#222220;--tx:#eeede8;--mu:#a09f96;--bd:#37362f;--ac:#19c37d;--acx:#06281c;--chip:#2c2b27}}
:root[data-theme="dark"]{--bg:#171716;--card:#222220;--tx:#eeede8;--mu:#a09f96;--bd:#37362f;--ac:#19c37d;--acx:#06281c;--chip:#2c2b27}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 system-ui,-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:22px;margin:0 0 4px}p.sub{margin:0 0 16px;color:var(--mu)}
.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}
@media(max-width:800px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
.side{position:sticky;top:12px;align-self:start}
.l{display:block;font-weight:600;font-size:13px;margin-bottom:6px}.l small,.hint{color:var(--mu);font-weight:400}
.hint{font-size:12px;margin-top:8px}
input[type=text]{width:100%;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:10px;padding:8px 11px;font:inherit}
input[type=file]{width:100%;color:var(--tx);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{border:1px solid var(--bd);background:var(--chip);color:var(--tx);border-radius:999px;padding:3px 11px;font:inherit;font-size:12.5px;cursor:pointer}
.chip.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.btn{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:7px 12px;font:inherit;font-size:13.5px;cursor:pointer}
.btn.p{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap}
#pv{display:none;max-width:100%;max-height:220px;border-radius:10px;margin-top:10px;object-fit:contain}
.op{border:1px solid var(--bd);border-radius:12px;margin-bottom:8px;background:var(--bg)}
.oh{width:100%;text-align:left;border:0;background:none;color:var(--tx);font:inherit;font-weight:600;padding:10px 12px;cursor:pointer;display:flex;justify-content:space-between}
.op.on{border-color:var(--ac)}.op.on .oh{color:var(--ac)}
.ob{display:none;padding:0 12px 12px}.op.on .ob{display:block}
.fl{font-size:12.5px;margin:8px 0 0;color:var(--mu)}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:10px;overflow:hidden;margin-bottom:10px}
.seg button{border:0;background:var(--card);color:var(--tx);padding:6px 14px;font:inherit;cursor:pointer}.seg button.on{background:var(--ac);color:var(--acx)}
#out{white-space:pre-wrap;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:12px;min-height:200px}
.frow{display:flex;align-items:center;gap:10px}.frow input{flex:1;accent-color:var(--ac)}
</style>
</head>
<body>
<div class="wrap">
<h1>🖌️ ChatGPT 修改圖檔指令產生器</h1>
<p class="sub">先上傳要修改的圖，再勾選想做的修改，自動組合出可貼進 ChatGPT 的編輯指令。</p>
<div class="grid">
<div>
<div class="card">
<span class="l">① 上傳要修改的原圖 <small>（只在你的瀏覽器預覽，不會上傳）</small></span>
<input type="file" id="fi" accept="image/*"><img id="pv" alt="原圖預覽">
<div class="hint">到 ChatGPT 時，請把同一張圖附加上去，再貼上右側指令。</div>
</div>
<div class="card">
<span class="l">✨ 快速範本 <small>（點一下套用）</small></span>
<div class="row" id="pre"></div>
</div>
<div class="card">
<span class="l">② 選擇要做的修改 <small>（可同時選多項，點標題展開）</small></span>
<div id="ops"></div>
</div>
<div class="card">
<span class="l">③ 請保持不變 <small>（可複選）</small></span>
<div class="chips" id="kp" style="margin:0 0 12px"></div>
<span class="l">④ 修改幅度 <small id="sv">50</small></span>
<div class="frow"><small>輕微微調</small><input type="range" id="sl" min="10" max="100" value="50"><small>大幅改造</small></div>
<span class="l" style="margin-top:12px">補充要求 <small>（選填）</small></span>
<input type="text" id="ex" placeholder="例如：保持原圖的溫暖氣氛">
<span class="l" style="margin-top:12px">避免出現 <small>（選填）</small></span>
<input type="text" id="ng" placeholder="例如：模糊、變形的手、多餘文字">
</div>
</div>
<div class="side card">
<div class="seg" id="lg"><button data-v="zh" class="on">中文指令</button><button data-v="en">English</button></div>
<div id="out"></div>
<div class="row" style="margin-top:12px"><button class="btn p" id="cp">複製指令</button><button class="btn" id="rs">清除全部</button></div>
<div class="hint" id="ms"><b>步驟：</b>① 在 ChatGPT 上傳原圖 → ② 貼上指令送出 → ③ 不滿意可追加「再自然一點」「改動小一點」微調。</div>
</div>
</div>
</div>
<script>
var $=function(i){return document.getElementById(i)};
// [id,icon,中,英,[[key,標籤,提示,chips[[zh,en]]]...],中文模板,英文模板]
var OPS=[
['bg','🌄','換背景','Change background',[['a','新背景','例如：海邊日落',[['海邊日落','a sunset beach'],['純白攝影棚背景','a pure white studio background'],['森林','a forest'],['城市夜景','a city night view'],['教室','a classroom'],['太空','outer space'],['櫻花樹下','under cherry blossom trees']]]],'把背景換成「{a}」，主體邊緣自然乾淨，光線與新背景一致。','Replace the background with {a}; keep the subject edges clean and match the lighting to the new background.'],
['rm','🧹','移除物件／人物','Remove objects',[['a','要移除的內容','例如：背景路人、電線、浮水印',[['背景路人','background passers-by'],['電線','power lines'],['垃圾與雜物','trash and clutter'],['浮水印','the watermark']]]],'移除「{a}」，並用自然的背景內容補齊，不留痕跡。','Remove {a} and fill the area naturally with matching background, leaving no trace.'],
['add','➕','新增物件','Add objects',[['a','要新增的內容','例如：一隻戴帽子的小狗'],['b','位置','例如：右下角的長椅旁']],'在{b:畫面中適當的位置}加入{a}，大小、透視與光影要與原圖協調。','Add {a} at {b:a suitable spot in the scene}; match size, perspective and lighting to the original.'],
['st','🎨','換藝術風格','Change art style',[['a','目標風格','例如：吉卜力水彩',[['吉卜力水彩','Ghibli-inspired watercolor'],['日系動畫','Japanese anime style'],['3D 皮克斯','Pixar-style 3D'],['油畫','oil painting'],['水墨國畫','Chinese ink wash painting'],['像素畫','pixel art'],['黏土動畫','claymation'],['賽博龐克','cyberpunk']]]],'把整張圖轉換成「{a}」風格，保留原本的人物與構圖。','Convert the whole image to {a} style while keeping the original characters and composition.'],
['co','🌈','調整色調／光線','Color and lighting',[['a','目標色調','例如：電影感調色',[['溫暖黃金時刻','warm golden hour tones'],['冷色調','cool tones'],['黑白','black and white'],['復古底片','a vintage film look'],['提亮清透','brighter and clearer'],['電影感調色','cinematic color grading'],['霓虹夜景','neon night lighting']]]],'調整整體色調與光線為「{a}」，保持自然，不要過曝或失真。','Adjust the overall color and lighting to {a}; keep it natural, with no overexposure or distortion.'],
['pt','🧑','人像修飾','Portrait retouching',[['a','修飾項目','例如：自然美肌去瑕疵',[['自然美肌去瑕疵','natural skin retouching and blemish removal'],['換髮色','change the hair color'],['換髮型','change the hairstyle'],['換服裝','change the outfit'],['自然微笑表情','a natural smile'],['加上眼鏡','add glasses']]],['b','細節說明','例如：改成栗棕色短髮']],'人像調整：{a}；{b:細節維持自然}。保持本人五官特徵與辨識度，不要過度修圖。','Portrait edit: {a}; {b:keep details natural}. Preserve the person’s facial identity and do not over-retouch.'],
['rt','🛠️','修復／提升畫質','Restore and enhance',[['a','處理項目','例如：老照片修復並上色',[['老照片修復並上色','restore the old photo and colorize it'],['去除雜訊與模糊','remove noise and blur'],['修補破損與折痕','repair scratches and creases'],['提升解析度與銳利度','enhance resolution and sharpness']]]],'畫質處理：{a}。盡量還原真實細節，不要改變人物長相。','Quality work: {a}. Recover true details and do not change anyone’s appearance.'],
['op','📐','擴圖（向外延伸）','Extend the canvas',[['a','目標比例','例如：16:9',[['16:9','16:9'],['9:16','9:16'],['1:1','1:1'],['3:2','3:2'],['2:3','2:3']]],['b','延伸內容','例如：左右延伸成更寬的海灘']],'擴圖：把畫面延伸成 {a} 比例，{b:自然延伸背景內容}，與原圖無縫銜接。','Extend the canvas to a {a} aspect ratio, {b:naturally continuing the background}, blending seamlessly with the original.'],
['tx','🔤','加入文字','Add text',[['a','文字內容','例如：夏日回憶'],['b','位置與樣式','例如：置中上方、白色粗體、帶陰影']],'在圖上加入文字「{a}」，位置與樣式：{b:置於下方、清晰易讀}。文字請完全照抄，不要出現錯字。','Add the text “{a}” to the image. Position and style: {b:at the bottom, clear and readable}. Copy the text exactly with no typos.'],
['lc','🎯','局部修改','Local edit',[['a','要改的區域','例如：左邊那位同學的帽子'],['b','改成什麼','例如：紅色棒球帽']],'局部修改：把{a}改成{b}，其餘部分保持不變。','Local edit: change {a} into {b} and leave everything else unchanged.'],
['cu','✂️','去背／商品圖','Cutout and product shot',[['a','輸出形式','例如：純白背景商品圖',[['透明背景','a transparent background'],['純白背景商品圖','a pure white background product photo'],['證件照白底','a white-background ID photo'],['灰色漸層攝影棚','a gray gradient studio background']]]],'主體去背並輸出為「{a}」，邊緣乾淨，保留髮絲與陰影等細節。','Cut out the subject and output it on {a}; keep clean edges and details such as hair strands and shadows.']
];
var KP=[['人物臉部與五官','facial features'],['整體構圖','overall composition'],['背景','background'],['原有色彩','original colors'],['圖中文字','existing text'],['人物姿勢','pose'],['圖片比例','aspect ratio'],['服裝','clothing']];
var PR=[
['🪪 證件照白底',{cu:{a:'證件照白底'},pt:{a:'自然美肌去瑕疵'}},[0,5],30],
['📷 老照片修復上色',{rt:{a:'老照片修復並上色'}},[0,1,5],50],
['🛍️ 商品白底主圖',{cu:{a:'純白背景商品圖'},co:{a:'提亮清透'}},[1,6],40],
['🌅 換海邊日落背景',{bg:{a:'海邊日落'},co:{a:'溫暖黃金時刻'}},[0,5,7],60],
['🧹 移除路人雜物',{rm:{a:'背景路人'}},[0,1,3],30],
['🎨 變吉卜力水彩',{st:{a:'吉卜力水彩'}},[0,1,5],80],
['📐 擴圖成 16:9',{op:{a:'16:9',b:'左右自然延伸背景'}},[0,1,3],50],
['🔤 加標題文字',{tx:{a:'夏日回憶',b:'置中上方、白色粗體、帶陰影'}},[1,3],40],
['🎬 電影感調色',{co:{a:'電影感調色'}},[0,1,2],50],
['🧒 頭貼卡通化',{st:{a:'3D 皮克斯'}},[0],70]
];
var act={},val={},keep=[],lang='zh',EN={};
OPS.forEach(function(o){o[4].forEach(function(f){(f[3]||[]).forEach(function(c){EN[c[0]]=c[1]})})});
$('ops').innerHTML=OPS.map(function(o){return '<div class="op" id="op_'+o[0]+'"><button class="oh" data-o="'+o[0]+'"><span>'+o[1]+' '+o[2]+'</span><span>＋</span></button><div class="ob">'+o[4].map(function(f){return '<div class="fl">'+f[1]+'</div><input type="text" id="i_'+o[0]+f[0]+'" data-o="'+o[0]+'" data-k="'+f[0]+'" placeholder="'+f[2]+'">'+(f[3]?'<div class="chips">'+f[3].map(function(c){return '<button class="chip" data-o="'+o[0]+'" data-k="'+f[0]+'" data-v="'+c[0]+'">'+c[0]+'</button>'}).join('')+'</div>':'')}).join('')+'</div></div>'}).join('');
$('kp').innerHTML=KP.map(function(k,i){return '<button class="chip" data-i="'+i+'">'+k[0]+'</button>'}).join('');
$('pre').innerHTML=PR.map(function(p,i){return '<button class="btn" data-p="'+i+'">'+p[0]+'</button>'}).join('');
function ui(){OPS.forEach(function(o){$('op_'+o[0]).classList.toggle('on',!!act[o[0]])});
document.querySelectorAll('#ops .chip').forEach(function(c){c.classList.toggle('on',(val[c.dataset.o+c.dataset.k]||'')===c.dataset.v)});
document.querySelectorAll('#kp .chip').forEach(function(c){c.classList.toggle('on',keep.indexOf(+c.dataset.i)>-1)});gen()}
document.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
if(b.classList.contains('oh')){var id=b.dataset.o;act[id]=!act[id];ui();return}
if(b.dataset.v!==undefined&&b.dataset.o){var k=b.dataset.o+b.dataset.k;val[k]=val[k]===b.dataset.v?'':b.dataset.v;$('i_'+k).value=val[k];act[b.dataset.o]=true;ui();return}
if(b.dataset.i!==undefined&&b.parentNode.id==='kp'){var i=+b.dataset.i,p=keep.indexOf(i);if(p>-1)keep.splice(p,1);else keep.push(i);ui();return}
if(b.dataset.p!==undefined){var pr=PR[+b.dataset.p];reset(true);Object.keys(pr[1]).forEach(function(id){act[id]=true;Object.keys(pr[1][id]).forEach(function(k){val[id+k]=pr[1][id][k];$('i_'+id+k).value=pr[1][id][k]})});keep=pr[2].slice();$('sl').value=pr[3];ui();$('ms').textContent='已套用範本，可再增減項目或修改文字。'}});
document.addEventListener('input',function(e){var t=e.target;if(t.dataset&&t.dataset.o&&t.dataset.k){val[t.dataset.o+t.dataset.k]=t.value;if(t.value.trim())act[t.dataset.o]=true;ui()}else if(t.id==='sl'||t.id==='ex'||t.id==='ng')gen()});
$('lg').onclick=function(e){var b=e.target.closest('button');if(!b)return;lang=b.dataset.v;this.querySelectorAll('button').forEach(function(x){x.classList.toggle('on',x===b)});gen()};
function reset(keepUi){act={};val={};keep=[];document.querySelectorAll('#ops input').forEach(function(i){i.value=''});if(!keepUi){$('ex').value='';$('ng').value='';$('sl').value=50;ui()}}
$('rs').onclick=function(){reset();$('ms').textContent='已清除。'};
var url=0;$('fi').onchange=function(){var f=this.files[0],p=$('pv');if(url)URL.revokeObjectURL(url);if(f){url=URL.createObjectURL(f);p.src=url;p.style.display='block'}else{url=0;p.style.display='none'}};
function fill(t,id,z){return t.replace(/\{(\w)(?::([^}]*))?\}/g,function(m,k,d){var x=(val[id+k]||'').trim();if(!x)return d||'';return z?x:(EN[x]||x)})}
function gen(){var z=lang==='zh',L=[],w=[],s=+$('sl').value;$('sv').textContent=s;
OPS.forEach(function(o){if(!act[o[0]])return;if(!(val[o[0]+'a']||'').trim()){w.push(z?o[2]:o[3]);return}L.push(fill(o[z?5:6],o[0],z))});
if(!L.length){$('out').textContent=z?'請先在左側點開至少一項修改並填寫內容，指令會即時顯示在這裡。'+(w.length?'\n\n⚠ 尚未填寫：'+w.join('、'):''):'Open at least one edit on the left and fill it in.'+(w.length?'\n\nStill empty: '+w.join(', '):'');return}
var t=[z?'請以我上傳的這張圖片為基礎進行編輯，不要重新創作一張全新的圖：':'Edit the image I uploaded, using it as the base. Do not create a brand-new image:'];
L.forEach(function(x,i){t.push((i+1)+'. '+x)});
if(keep.length)t.push(z?'請務必保持不變：'+keep.map(function(i){return KP[i][0]}).join('、')+'。':'Keep unchanged: '+keep.map(function(i){return KP[i][1]}).join(', ')+'.');
var d=s<35?(z?'輕微微調':'subtle tweaks'):s<70?(z?'中等幅度':'moderate'):(z?'大幅改造':'major transformation');
t.push(z?'修改幅度：'+d+'。':'Edit strength: '+d+'.');
if($('ex').value.trim())t.push((z?'補充要求：':'Extra requirements: ')+$('ex').value.trim()+(z?'。':'.'));
if($('ng').value.trim())t.push((z?'請避免：':'Avoid: ')+$('ng').value.trim()+(z?'。':'.'));
t.push(z?'請直接輸出編輯後的圖片，並保持原圖的畫質與清晰度。':'Output the edited image directly and keep the original quality and sharpness.');
$('out').textContent=t.join('\n')+(w.length?'\n\n⚠ 以下項目尚未填寫，已略過：'+w.join(z?'、':', '):'')}
$('cp').onclick=function(){var t=$('out').textContent,m=$('ms');function ok(){m.textContent='✅ 已複製！記得在 ChatGPT 先附上原圖再貼上。'}
function fb(){var r=document.createRange();r.selectNodeContents($('out'));var q=getSelection();q.removeAllRanges();q.addRange(r);try{document.execCommand('copy');ok()}catch(x){m.textContent='請手動選取文字複製'}}
try{navigator.clipboard.writeText(t).then(ok,fb)}catch(x){fb()}};
ui();
</script>
</body>
</html>
